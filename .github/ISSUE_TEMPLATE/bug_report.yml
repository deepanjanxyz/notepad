name: Bug report
description: Report a problem so it can be reproduced and fixed.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Only the description below is required — fill in whatever else you know and leave the rest.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem in a sentence or two.
      placeholder: "e.g. The app closes when I open a drawing note."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional. The steps that trigger the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Optional. Shown in the app or on the release page.
      placeholder: "e.g. 1.0.18"
    validations:
      required: false
  - type: input
    id: android_version
    attributes:
      label: Android version and device
      description: Optional.
      placeholder: "e.g. Android 14, Pixel 6"
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Optional. Screenshots, videos or logs that may help.
    validations:
      required: false
