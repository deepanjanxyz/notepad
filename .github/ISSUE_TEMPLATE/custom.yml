name: Custom issue
description: Open a free-form issue when it is not a bug or a feature request.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Anything that does not fit the other templates. Only the description below is required.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe your question, problem or suggestion.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Optional. Background, screenshots, logs or links.
    validations:
      required: false
