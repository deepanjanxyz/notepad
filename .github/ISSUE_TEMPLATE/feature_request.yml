name: Feature request
description: Suggest a feature or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain what problem this feature would solve or why it would be useful.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think the feature could work.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or approaches you considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, examples, references, or anything else that may help explain the proposal.
    validations:
      required: false
