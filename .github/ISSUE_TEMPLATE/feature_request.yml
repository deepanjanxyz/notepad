name: Feature request
description: Suggest a feature or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Only the description below is required.
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Optional. What would this solve for you?
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Optional. How you think it could work.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Optional. Examples, references or screenshots.
    validations:
      required: false
