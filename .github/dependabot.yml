version: 2

updates:
  # Bazel dependencies live in MODULE.bazel / the maven.install block there.
  # Dependabot has no Bazel ecosystem, so those are bumped by hand (or with
  # `bazel run @unpinned_maven//:pin` after editing MODULE.bazel).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
