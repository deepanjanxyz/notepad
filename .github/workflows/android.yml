name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK (platform 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # The keystore must be in place before the build: app/build.gradle.kts
      # configures release signing during configuration and fails any release
      # task when the keystore or the KEYSTORE_PASSWORD / KEY_ALIAS /
      # KEY_PASSWORD values are missing. Gradle therefore signs the release APK
      # as it builds it.
      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Verify APK signatures
        run: |
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No release APK found."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$apk"
          done

      - name: Remove keystore file
        if: always()
        run: rm -f app/keystore.jks

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk
