name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (platform 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # One APK per ABI plus the universal one, via the ABI platforms in the
      # root BUILD file (`--config=release`).
      - name: Build unsigned release APKs
        run: bazel build //app:app --config=release

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-release-key.jks

      - name: Sign APKs
        run: |
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0"
          OUT="$PWD/signed"
          mkdir -p "$OUT"
          shopt -s nullglob
          apks=(bazel-bin/app/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No release APK found to sign."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            case "$name" in
              *_unsigned.apk) name="${name%_unsigned.apk}.apk" ;;
            esac
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks app/my-release-key.jks \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --out "$OUT/${name%.apk}-signed.apk" \
              "$apk"
          done

      - name: Remove keystore file
        if: always()
        run: rm -f app/my-release-key.jks

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: signed/*-signed.apk
