name: Auto Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  guard:
    name: Guard - application source check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deep-check whether a shipping file changed
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash .github/scripts/shipping-changed.sh

  release:
    name: Release on merge to main
    needs: guard
    if: needs.guard.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      KEYSTORE_PATH: app/keystore.jks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Android SDK tools and accept licenses
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Read the version from app/build.gradle.kts
        id: version
        run: |
          app_name=$(grep -oE 'rootProject.name[[:space:]]*=[[:space:]]*"[^"]*"' settings.gradle.kts | grep -oE '"[^"]*"' | tr -d '"' || true)
          if [ -z "$app_name" ] || [[ "$app_name" == */* ]]; then
            echo "🔴 Release failed: app name could not be resolved."
            exit 1
          fi

          # The version guard on pull requests guarantees that every merge into
          # main already carries a bumped versionCode/versionName, so the
          # committed values are the single source of truth for the release.
          vn=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]*"' app/build.gradle.kts | sed -E 's/.*"(.*)"/\1/' | head -n1 || true)
          vc=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -n1 || true)

          if [ -z "$vn" ] || [ -z "$vc" ]; then
            echo "🔴 Release failed: could not read versionName/versionCode from app/build.gradle.kts."
            exit 1
          fi
          if ! [[ "$vn" =~ ^[0-9A-Za-z.+_-]{1,64}$ ]]; then
            echo "🔴 Release failed: versionName contains unsafe characters."
            exit 1
          fi

          echo "Releasing v$vn ($vc) from commit $(git rev-parse HEAD)"
          # Only these three words make a release a pre-release. Build metadata
          # does not affect SemVer precedence or prerelease status.
          release_version="${vn%%+*}"
          if echo "$release_version" | grep -qiE '(^|[.-])(alpha|beta|rc)[0-9]*([.-]|$)'; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "app_name=$app_name"
            echo "version=$vn"
            echo "version_code=$vc"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          if ! python3 .github/scripts/semver.py validate "$VERSION"; then
            echo "🔴 Release failed: versionName '$VERSION' is not valid SemVer."
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "🔴 Release failed: versionCode '$VERSION_CODE' is missing or not a positive integer."
            exit 1
          fi

      - name: Ensure the version is newer than the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          latest_tag=$(git tag --list 'v*' | python3 .github/scripts/semver.py max)
          if [ -z "$latest_tag" ]; then
            echo "No previous release; nothing to compare against."
            exit 0
          fi
          latest_name="${latest_tag#v}"
          latest_code=$(gh release view "$latest_tag" --json assets --jq '.assets[].name' 2>/dev/null \
            | sed -nE 's/.*-([0-9]+)-[^-]+\.apk$/\1/p' | sort -n | tail -n1 || true)
          if [ -n "$latest_code" ] && [ "$VERSION_CODE" -le "$latest_code" ]; then
            echo "🔴 Release failed: versionCode $VERSION_CODE is not newer than $latest_tag ($latest_code). Re-bump and open a new pull request."
            exit 1
          fi
          if ! comparison=$(python3 .github/scripts/semver.py compare "$VERSION" "$latest_name"); then
            echo "🔴 Release failed: SemVer comparison could not be completed."
            exit 1
          fi
          if ! [[ "$comparison" =~ ^-?[0-9]+$ ]]; then
            echo "🔴 Release failed: SemVer comparison returned an invalid result."
            exit 1
          fi
          if [ "$comparison" -le 0 ]; then
            echo "🔴 Release failed: versionName $VERSION is not newer than $latest_tag ($latest_name). Re-bump and open a new pull request."
            exit 1
          fi

      - name: Check for existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Fail closed: only an HTTP 404 means the tag is free.
          if out=$(gh api "repos/${REPO}/git/ref/tags/v${VERSION}" 2>&1); then
            echo "🔴 Release failed: Tag v${VERSION} already exists on remote!"
            exit 1
          fi
          if ! grep -q 'HTTP 404' <<< "$out"; then
            echo "🔴 Release failed: could not verify tag state: $out"
            exit 1
          fi

      - name: Resolve release range
        id: context
        run: |
          target=$(git rev-parse HEAD)
          last_author=$(git log -1 --format='%an')
          if [ "$last_author" = "github-actions[bot]" ]; then
            while IFS=$'\t' read -r sha author; do
              case "$author" in
                *"[bot]"*) continue ;;
              esac
              target="$sha"
              break
            done < <(git log --format='%H%x09%an' -n 100)
          fi

          prev_tag=$(git describe --tags --abbrev=0 --match 'v*' "$target^" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            base="$prev_tag"
          else
            base=$(git rev-list --max-parents=0 "$target" | tail -n1)
          fi

          git log --oneline --no-merges "$base..$target" > /tmp/commits.txt || true
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "Comparing ${prev_tag:-the initial commit} -> $target"

      - name: Build diff-derived changelog
        env:
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          python3 - "$BASE" "$TARGET" <<'PY'
          import os
          import subprocess
          import sys
          from collections import OrderedDict

          base, target = sys.argv[1], sys.argv[2]


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout


          categories = OrderedDict([
              ("App source", lambda p: p.startswith("app/src/main/java/") or p.startswith("app/src/main/kotlin/")),
              ("Tests", lambda p: "/src/test/" in p or "/src/androidTest/" in p),
              ("Resources", lambda p: p.startswith("app/src/main/res/")),
              ("Manifest", lambda p: p.endswith("AndroidManifest.xml")),
              ("Build and dependencies", lambda p: p.endswith((".gradle.kts", ".gradle", ".toml")) or p.endswith("gradle.properties")),
              ("CI and workflows", lambda p: p.startswith(".github/")),
              ("Documentation", lambda p: p.lower().endswith((".md", ".txt"))),
              ("Other", lambda p: True),
          ])


          def category_of(path):
              for name, matches in categories.items():
                  if matches(path):
                      return name
              return "Other"


          files = OrderedDict((name, []) for name in categories)
          added = OrderedDict((name, 0) for name in categories)
          deleted = OrderedDict((name, 0) for name in categories)

          for line in git("diff", "--numstat", base, target).splitlines():
              parts = line.split("\t")
              if len(parts) != 3:
                  continue
              add, rem, path = parts
              name = category_of(path)
              files[name].append(path)
              added[name] += int(add) if add.isdigit() else 0
              deleted[name] += int(rem) if rem.isdigit() else 0

          new_files, removed_files = [], []
          for line in git("diff", "--name-status", base, target).splitlines():
              parts = line.split("\t")
              if len(parts) < 2:
                  continue
              status, path = parts[0], parts[-1]
              if status.startswith("A"):
                  new_files.append(path)
              elif status.startswith("D"):
                  removed_files.append(path)

          total_files = sum(len(v) for v in files.values())
          total_add = sum(added.values())
          total_del = sum(deleted.values())
          commits = git("rev-list", "--count", base + ".." + target).strip() or "0"

          out = ["### Changes in this release", ""]
          out.append("**%d files changed** (+%d / -%d) across %s commit(s)." % (total_files, total_add, total_del, commits))
          out += ["", "| Area | Files | Added | Removed |", "| :--- | ---: | ---: | ---: |"]
          for name in categories:
              if files[name]:
                  out.append("| %s | %d | +%d | -%d |" % (name, len(files[name]), added[name], deleted[name]))
          out.append("")

          if new_files:
              out += ["#### New files", ""] + ["- `%s`" % p for p in new_files] + [""]
          if removed_files:
              out += ["#### Removed files", ""] + ["- `%s`" % p for p in removed_files] + [""]
          if files["Build and dependencies"]:
              out += ["#### Build and dependency files touched", ""] + ["- `%s`" % p for p in files["Build and dependencies"]] + [""]

          with open("/tmp/changelog.md", "w") as fh:
              fh.write("\n".join(out) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("files=%d\n" % total_files)
              fh.write("added=%d\n" % total_add)
              fh.write("deleted=%d\n" % total_del)
          PY

      - name: Compose release notes
        env:
          PREV_TAG: ${{ steps.context.outputs.prev_tag }}
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
          REPO: ${{ github.repository }}
        run: |
          {
            cat /tmp/changelog.md
            echo ""
            if [ -s /tmp/commits.txt ]; then
              echo "### Commits"
              echo ""
              sed 's/^/- /' /tmp/commits.txt
              echo ""
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`$PREV_TAG\`. Released from commit \`$TARGET\`."
            else
              echo "First release. Released from commit \`$TARGET\`."
            fi
            echo ""
            echo "[Full diff](https://github.com/${REPO}/compare/$BASE...$TARGET)"
          } > /tmp/release-notes.md

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          rm -f "$KEYSTORE_PATH"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "🔴 Release failed: decoded keystore is empty."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Delete the decoded keystore
        if: always()
        run: |
          if [ -e "$KEYSTORE_PATH" ]; then
            shred -u -f "$KEYSTORE_PATH" 2>/dev/null || rm -f "$KEYSTORE_PATH"
          fi
          if [ -e "$KEYSTORE_PATH" ]; then
            echo "🔴 Decoded keystore is still present after cleanup."
            exit 1
          fi
          echo "Decoded keystore removed."

      - name: Rename release APKs
        env:
          APP_NAME: ${{ steps.version.outputs.app_name }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME_PATTERN: ${{ vars.APK_NAME_PATTERN }}
        run: |
          out="app/build/outputs/apk/release"
          shopt -s nullglob
          apks=("$out"/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No release APK was produced to rename."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            case "$name" in
              app-release.apk)
                abi="universal"
                ;;
              app-*-release.apk)
                abi="${name#app-}"
                abi="${abi%-release.apk}"
                ;;
              *)
                abi="universal"
                ;;
            esac
            mv "$apk" "$out/${APP_NAME}-v${VERSION}-${VERSION_CODE}-${abi}.apk"
          done

          # Optional store contract: when APK_NAME_PATTERN is set, every final
          # file name must match it, otherwise the release is stopped before publishing.
          if [ -n "${APK_NAME_PATTERN:-}" ]; then
            for apk in "$out"/*.apk; do
              name=$(basename "$apk")
              if ! [[ "$name" =~ $APK_NAME_PATTERN ]]; then
                echo "🔴 Release failed: '$name' does not match APK_NAME_PATTERN; the store would not find it."
                exit 1
              fi
            done
          fi

          ls -l "$out"/*.apk

      - name: Verify APK signatures
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=""
          if [ -n "$sdk" ]; then
            apksigner=$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -z "$apksigner" ]; then
            echo "🔴 apksigner was not installed by the Android Gradle Plugin."
            exit 1
          fi

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No APK found to verify."
            exit 1
          fi

          expected=""
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')
          else
            echo "⚠️ Repository variable EXPECTED_SIGNING_CERT_SHA256 is not set; skipping the signing-certificate pin check."
          fi

          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$apksigner" verify --verbose "$apk"
            if [ -n "$expected" ]; then
              actual=$("$apksigner" verify --print-certs "$apk" \
                | sed -nE 's/^Signer #1 certificate SHA-256 digest: //p' \
                | tr -d ' :' | tr 'A-F' 'a-f')
              if [ "$actual" != "$expected" ]; then
                echo "🔴 Signing certificate for $apk does not match the pinned digest."
                exit 1
              fi
              echo "Signing certificate matches the pinned digest."
            fi
          done

      - name: Append SHA-256 checksums
        run: |
          (cd app/build/outputs/apk/release && sha256sum ./*.apk) > /tmp/SHA256SUMS
          {
            echo ""
            echo "### SHA-256 checksums"
            echo ""
            echo '```'
            cat /tmp/SHA256SUMS
            echo '```'
          } >> /tmp/release-notes.md

      - name: List the contributors for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          # Everyone who committed since the previous tag, bots left out.
          logins=$(gh api "repos/${REPO}/compare/${BASE}...${TARGET}" --paginate \
            --jq '.commits[].author.login' 2>/dev/null \
            | grep -vE '^null$|\[bot\]$' | sort -u || true)

          {
            echo ""
            echo "### Contributors"
            echo ""
            if [ -z "$logins" ]; then
              echo "No contributors to list for this release."
            else
              while IFS= read -r login; do
                [ -n "$login" ] || continue
                echo "<a href=\"https://github.com/${login}\"><img src=\"https://github.com/${login}.png?size=120\" width=\"80\" height=\"80\" alt=\"${login}\"></a>"
                echo ""
                echo "**[${login}](https://github.com/${login})**"
                echo ""
              done <<< "$logins"
            fi
          } >> /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            app/build/outputs/apk/release/*.apk \
            /tmp/SHA256SUMS \
            --target "$TARGET_SHA" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "${flags[@]}"
