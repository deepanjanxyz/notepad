name: Auto Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard - application source check
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
      version_updated: ${{ steps.version.outputs.version_updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify application source changed
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only HEAD^ HEAD 2>/dev/null || git show --pretty="" --name-only HEAD)
          else
            files=$(git diff --name-only "$base" "$head")
          fi

          echo "Changed files:"
          echo "$files"

          if echo "$files" | grep -qE '^app/src/main/|\.gradle\.kts$|gradle\.properties$'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare version against main
        id: version
        if: github.event_name == 'pull_request'
        run: |
          git show "${{ github.event.pull_request.base.sha }}:app/build.gradle.kts" > /tmp/base_build.gradle.kts 2>/dev/null || true
          head_vc=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          head_vn=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]*"' app/build.gradle.kts | grep -oE '"[^"]*"' | tr -d '"')
          base_vc=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' /tmp/base_build.gradle.kts | grep -oE '[0-9]+' || true)
          base_vn=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]*"' /tmp/base_build.gradle.kts | grep -oE '"[^"]*"' | tr -d '"' || true)
          if [ "$head_vc" != "$base_vc" ] || [ "$head_vn" != "$base_vn" ]; then
            echo "version_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_updated=false" >> "$GITHUB_OUTPUT"
          fi

  auto-bump:
    name: Bump version on the PR branch
    needs: guard
    if: >-
      github.event_name == 'pull_request'
      && needs.guard.outputs.code_changed == 'true'
      && needs.guard.outputs.version_updated == 'false'
      && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-bump-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pre-flight app name & version verification
        id: preflight
        run: |
          app_name=$(grep -oE 'rootProject.name[[:space:]]*=[[:space:]]*"[^"]*"' settings.gradle.kts | grep -oE '"[^"]*"' | tr -d '"')
          vn=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]*"' app/build.gradle.kts | grep -oE '"[^"]*"' | tr -d '"')
          vc=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')

          echo "App name:     ${app_name:-<missing>}"
          echo "Version name: ${vn:-<missing>}"
          echo "Version code: ${vc:-<missing>}"

          if [ -z "$app_name" ]; then
            echo "🔴 Pre-flight failed: app name could not be resolved."
            exit 1
          fi
          if [ -z "$vn" ] || ! echo "$vn" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "🔴 Pre-flight failed: versionName '$vn' is missing or not strict SemVer (X.Y.Z)."
            exit 1
          fi
          if [ -z "$vc" ] || ! echo "$vc" | grep -qE '^[1-9][0-9]*$'; then
            echo "🔴 Pre-flight failed: versionCode '$vc' is missing or not a positive integer."
            exit 1
          fi

          {
            echo "app_name=$app_name"
            echo "version_name=$vn"
            echo "version_code=$vc"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version on the PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          vn="${{ steps.preflight.outputs.version_name }}"
          vc="${{ steps.preflight.outputs.version_code }}"
          new_vc=$((vc + 1))
          IFS='.' read -r major minor patch <<< "$vn"
          new_vn="$major.$minor.$((patch + 1))"

          sed -i "s/versionCode[[:space:]]*=[[:space:]]*[0-9]\+/versionCode = $new_vc/" app/build.gradle.kts
          sed -i "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"$new_vn\"/" app/build.gradle.kts

          if git diff --quiet -- app/build.gradle.kts; then
            echo "🔴 Bump failed: app/build.gradle.kts did not change."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version [skip ci]"
          git push origin "HEAD:$HEAD_REF"

  release:
    name: Release on merge to main
    needs: guard
    if: github.event_name == 'push' && needs.guard.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK (platform 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Read app metadata
        id: version
        run: |
          app_name=$(grep -oE 'rootProject.name[[:space:]]*=[[:space:]]*"[^"]*"' settings.gradle.kts | grep -oE '"[^"]*"' | tr -d '"')
          vn=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]*"' app/build.gradle.kts | grep -oE '"[^"]*"' | tr -d '"')
          vc=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          {
            echo "app_name=$app_name"
            echo "version=$vn"
            echo "version_code=$vc"
          } >> "$GITHUB_OUTPUT"

      - name: Validate version
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "🔴 Release failed: versionName '$version' is not strict SemVer (X.Y.Z)."
            exit 1
          fi
          code="${{ steps.version.outputs.version_code }}"
          if ! echo "$code" | grep -qE '^[1-9][0-9]*$'; then
            echo "🔴 Release failed: versionCode '$code' is missing or not a positive integer."
            exit 1
          fi

      - name: Check for existing tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "🔴 Release failed: Tag v${{ steps.version.outputs.version }} already exists on remote!"
            exit 1
          fi

      - name: Resolve release range
        id: context
        run: |
          target=$(git rev-parse HEAD)
          last_author=$(git log -1 --format='%an')
          if [ "$last_author" = "github-actions[bot]" ]; then
            while IFS=$'\t' read -r sha author; do
              case "$author" in
                *"[bot]"*) continue ;;
              esac
              target="$sha"
              break
            done < <(git log --format='%H%x09%an' -n 100)
          fi

          prev_tag=$(git describe --tags --abbrev=0 --match 'v*' "$target^" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            base="$prev_tag"
          else
            base=$(git rev-list --max-parents=0 "$target" | tail -n1)
          fi

          git log --oneline --no-merges "$base..$target" > /tmp/commits.txt || true
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "Comparing ${prev_tag:-the initial commit} -> $target"

      - name: Build diff-derived changelog
        env:
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          python3 - "$BASE" "$TARGET" <<'PY'
          import os
          import subprocess
          import sys
          from collections import OrderedDict

          base, target = sys.argv[1], sys.argv[2]


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout


          categories = OrderedDict([
              ("App source", lambda p: p.startswith("app/src/main/java/") or p.startswith("app/src/main/kotlin/")),
              ("Tests", lambda p: "/src/test/" in p or "/src/androidTest/" in p),
              ("Resources", lambda p: p.startswith("app/src/main/res/")),
              ("Manifest", lambda p: p.endswith("AndroidManifest.xml")),
              ("Build and dependencies", lambda p: p.endswith((".gradle.kts", ".gradle", ".toml")) or p.endswith("gradle.properties")),
              ("CI and workflows", lambda p: p.startswith(".github/")),
              ("Documentation", lambda p: p.lower().endswith((".md", ".txt"))),
              ("Other", lambda p: True),
          ])


          def category_of(path):
              for name, matches in categories.items():
                  if matches(path):
                      return name
              return "Other"


          files = OrderedDict((name, []) for name in categories)
          added = OrderedDict((name, 0) for name in categories)
          deleted = OrderedDict((name, 0) for name in categories)

          for line in git("diff", "--numstat", base, target).splitlines():
              parts = line.split("\t")
              if len(parts) != 3:
                  continue
              add, rem, path = parts
              name = category_of(path)
              files[name].append(path)
              added[name] += int(add) if add.isdigit() else 0
              deleted[name] += int(rem) if rem.isdigit() else 0

          new_files, removed_files = [], []
          for line in git("diff", "--name-status", base, target).splitlines():
              parts = line.split("\t")
              if len(parts) < 2:
                  continue
              status, path = parts[0], parts[-1]
              if status.startswith("A"):
                  new_files.append(path)
              elif status.startswith("D"):
                  removed_files.append(path)

          total_files = sum(len(v) for v in files.values())
          total_add = sum(added.values())
          total_del = sum(deleted.values())
          commits = git("rev-list", "--count", base + ".." + target).strip() or "0"

          out = ["### Changes in this release", ""]
          out.append("**%d files changed** (+%d / -%d) across %s commit(s)." % (total_files, total_add, total_del, commits))
          out += ["", "| Area | Files | Added | Removed |", "| :--- | ---: | ---: | ---: |"]
          for name in categories:
              if files[name]:
                  out.append("| %s | %d | +%d | -%d |" % (name, len(files[name]), added[name], deleted[name]))
          out.append("")

          if new_files:
              out += ["#### New files", ""] + ["- `%s`" % p for p in new_files] + [""]
          if removed_files:
              out += ["#### Removed files", ""] + ["- `%s`" % p for p in removed_files] + [""]
          if files["Build and dependencies"]:
              out += ["#### Build and dependency files touched", ""] + ["- `%s`" % p for p in files["Build and dependencies"]] + [""]

          with open("/tmp/changelog.md", "w") as fh:
              fh.write("\n".join(out) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("files=%d\n" % total_files)
              fh.write("added=%d\n" % total_add)
              fh.write("deleted=%d\n" % total_del)
          PY

      - name: Analyse the diff with Copilot
        id: ai
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          set -uo pipefail
          echo "ran=false" >> "$GITHUB_OUTPUT"
          : > /tmp/ai-summary.md
          if [ -z "${COPILOT_TOKEN:-}" ]; then
            echo "No COPILOT_TOKEN configured; release notes will use the diff changelog only."
            exit 0
          fi
          npm install -g @github/copilot >/dev/null 2>&1 || true
          if ! command -v copilot >/dev/null 2>&1; then
            echo "Copilot CLI unavailable on this runner; release notes will use the diff changelog only."
            exit 0
          fi

          diff="$(git diff "$BASE" "$TARGET" | head -c 100000 || true)"
          prompt="Analyse this release diff for the Android app 'notepad'. Describe what actually changed and its impact, based only on the diff: new features, behaviour changes, bug fixes, refactors, and build or dependency changes. Do not repeat the diff line by line. Be concise and factual. Diff:${diff}"

          if out="$(GH_TOKEN="$COPILOT_TOKEN" copilot -p "$prompt" 2>&1)"; then
            printf '%s\n' "$out" > /tmp/ai-summary.md
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "Copilot analysis failed; release notes will use the diff changelog only."
          fi

      - name: Compose release notes
        env:
          AI_RAN: ${{ steps.ai.outputs.ran }}
          PREV_TAG: ${{ steps.context.outputs.prev_tag }}
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          {
            if [ "$AI_RAN" = "true" ]; then
              echo "## Summary"
              echo ""
              cat /tmp/ai-summary.md
              echo ""
            fi
            cat /tmp/changelog.md
            echo ""
            if [ -s /tmp/commits.txt ]; then
              echo "### Commits"
              echo ""
              sed 's/^/- /' /tmp/commits.txt
              echo ""
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`$PREV_TAG\`. Released from commit \`$TARGET\`."
            else
              echo "First release. Released from commit \`$TARGET\`."
            fi
            echo ""
            echo "[Full diff](https://github.com/${{ github.repository }}/compare/$BASE...$TARGET)"
          } > /tmp/release-notes.md

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          ./gradlew assembleRelease --no-daemon

      - name: Rename release APKs
        run: |
          app_name="${{ steps.version.outputs.app_name }}"
          vn="${{ steps.version.outputs.version }}"
          vc="${{ steps.version.outputs.version_code }}"
          out="app/build/outputs/apk/release"

          shopt -s nullglob
          apks=("$out"/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No release APK was produced to rename."
            exit 1
          fi

          for i in "${!apks[@]}"; do
            suffix=""
            if [ "$i" -gt 0 ]; then
              suffix="-$((i + 1))"
            fi
            mv "${apks[$i]}" "$out/${app_name}-v${vn}-${vc}${suffix}.apk"
          done

          ls -l "$out"/*.apk

      - name: Verify APK signatures
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No APK found to verify."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$build_tools/apksigner" verify --verbose "$apk"
          done

      - name: Append SHA-256 checksums
        run: |
          {
            echo ""
            echo "### SHA-256 checksums"
            echo ""
            echo '```'
            (cd app/build/outputs/apk/release && sha256sum ./*.apk)
            echo '```'
          } >> /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            app/build/outputs/apk/release/*.apk \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
