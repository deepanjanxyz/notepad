name: Auto Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Lets the version-guard warning offer a one-command fix: commenting
  # `/bump-version` on a `main` pull request bumps the version for you.
  issue_comment:
    types: [created]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-guard:
    name: Guard - version bump required
    needs: guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reuse the shipping-file check from the `guard` job: a pull request that
      # only touches documentation (README, *.md, *.txt, images, or any other
      # non-shipping path) must not be forced to raise the version.
      - name: Decide whether this pull request must bump the version
        id: scope
        env:
          CODE_CHANGED: ${{ needs.guard.outputs.code_changed }}
        run: |
          if [ "$CODE_CHANGED" = "true" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Shipping files changed; a version bump is required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change (README, .md, .txt, images or other non-shipping files); no version bump is required."
          fi

      - name: Note that a documentation-only change skips the version bump
        if: steps.scope.outputs.required != 'true'
        run: echo "::notice::Documentation-only change; the version bump requirement is skipped."

      - name: Compare the PR version with the latest release
        id: compare
        if: steps.scope.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr_name=$(grep -oE 'VERSION_NAME[[:space:]]*=[[:space:]]*"[^"]*"' version.bzl | sed -E 's/.*"(.*)"/\1/' | head -n1 || true)
          pr_code=$(grep -oE 'VERSION_CODE[[:space:]]*=[[:space:]]*[0-9]+' version.bzl | grep -oE '[0-9]+' | head -n1 || true)

          if [ -z "$pr_name" ] || [ -z "$pr_code" ]; then
            echo "Could not read versionName/versionCode from version.bzl."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          latest_name=""
          latest_code=""
          if [ -n "$latest_tag" ]; then
            latest_name="${latest_tag#v}"
            # The versionCode as actually published in the latest release's APK names.
            latest_code=$(gh release view "$latest_tag" --json assets --jq '.assets[].name' 2>/dev/null \
              | sed -nE 's/.*-([0-9]+)-[^-]+\.apk$/\1/p' | sort -n | tail -n1 || true)
            # Fall back to the versionCode committed at that tag.
            if [ -z "$latest_code" ]; then
              latest_code=$(git show "$latest_tag:version.bzl" 2>/dev/null \
                | grep -oE 'VERSION_CODE[[:space:]]*=[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
            fi
          fi

          echo "PR:             versionName=$pr_name versionCode=$pr_code"
          echo "Latest release: tag=${latest_tag:-<none>} versionName=${latest_name:-<unknown>} versionCode=${latest_code:-<unknown>}"

          {
            echo "pr_name=$pr_name"
            echo "pr_code=$pr_code"
            echo "latest_tag=$latest_tag"
            echo "latest_name=$latest_name"
            echo "latest_code=$latest_code"
          } >> "$GITHUB_OUTPUT"

          # 1. versionCode must be greater than the latest release's versionCode.
          if [ -z "$latest_code" ]; then
            echo "No released versionCode found; skipping the numeric comparison."
          elif [ "$pr_code" -le "$latest_code" ]; then
            echo "versionCode not bumped: $pr_code <= $latest_code"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. versionName must be strict SemVer and greater than the latest release's versionName.
          if ! echo "$pr_name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "versionName is not strict SemVer (X.Y.Z): $pr_name"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=name" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$latest_name" ]; then
            highest=$(printf '%s\n%s\n' "$latest_name" "$pr_name" | sort -V | tail -n1)
            if [ "$pr_name" = "$latest_name" ] || [ "$highest" != "$pr_name" ]; then
              echo "versionName not bumped: $pr_name <= $latest_name"
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              echo "reason=name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 3. No other open pull request into main may claim the same versionCode.
          collision=""
          while read -r num oid; do
            [ -z "$num" ] && continue
            [ "$num" = "$PR" ] && continue
            other_code=$(gh api "repos/${GITHUB_REPOSITORY}/contents/version.bzl?ref=${oid}" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null \
              | grep -oE 'VERSION_CODE[[:space:]]*=[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
            if [ -n "$other_code" ] && [ "$other_code" = "$pr_code" ]; then
              collision="$num"
              break
            fi
          done <<< "$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --state open --limit 100 \
            --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"' 2>/dev/null || true)"

          if [ -n "$collision" ]; then
            echo "versionCode $pr_code collides with open pull request #$collision"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=collision" >> "$GITHUB_OUTPUT"
            echo "collision_pr=$collision" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bump OK: versionCode $pr_code > ${latest_code:-none}, versionName $pr_name > ${latest_name:-none}"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: steps.scope.outputs.required == 'true' && steps.compare.outputs.bumped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_NAME: ${{ steps.compare.outputs.pr_name }}
          PR_CODE: ${{ steps.compare.outputs.pr_code }}
          LATEST_TAG: ${{ steps.compare.outputs.latest_tag }}
          LATEST_NAME: ${{ steps.compare.outputs.latest_name }}
          LATEST_CODE: ${{ steps.compare.outputs.latest_code }}
          COLLISION_PR: ${{ steps.compare.outputs.collision_pr }}
          REASON: ${{ steps.compare.outputs.reason }}
        run: |
          set -euo pipefail
          marker='<!-- version-guard -->'

          case "${REASON:-}" in
            missing)
              detail="Could not read \`versionCode\`/\`versionName\` from \`version.bzl\`." ;;
            code)
              detail="This pull request declares \`versionCode = ${PR_CODE:-?}\`, but the latest release \`${LATEST_TAG:-<none>}\` already uses \`versionCode ${LATEST_CODE:-?}\`." ;;
            name)
              detail="\`versionName\` must be a strict \`X.Y.Z\` value greater than the latest release \`${LATEST_NAME:-?}\`, but this pull request declares \`${PR_NAME:-?}\`." ;;
            collision)
              detail="\`versionCode ${PR_CODE:-?}\` is also claimed by open pull request #${COLLISION_PR:-?}. Only one open pull request may use a given \`versionCode\`." ;;
            *)
              detail="The version in \`version.bzl\` does not satisfy the release rules." ;;
          esac

          body=$(cat <<EOF
          ${marker}
          ## 🔴 Version bump required

          ${detail}

          Every pull request merged into \`main\` must raise \`VERSION_CODE\` above the
          latest release and set a \`VERSION_NAME\` that is a greater \`X.Y.Z\`, so the
          release job can tag and publish the merge without rewriting the version.

          ### 🛠️ Fix it in one step

          Comment **\`/bump-version\`** on this pull request and the bot will raise
          both values on this branch for you. This check then re-runs on its own —
          once it is green, merge and the release starts automatically.

          ### ✍️ Or do it by hand

          \`\`\`starlark
          VERSION_CODE = <greater than ${LATEST_CODE:-the latest}>
          VERSION_NAME = "<greater than ${LATEST_NAME:-the latest}>"
          \`\`\`
          Then push — the check re-runs automatically.
          EOF
          )

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi

      - name: Remove the guard comment once the version is bumped
        if: steps.scope.outputs.required == 'true' && steps.compare.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- version-guard -->'
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" > /dev/null || true
          done

      - name: Fail the check when the version was not bumped
        if: steps.scope.outputs.required == 'true' && steps.compare.outputs.bumped != 'true'
        run: |
          echo "::error::version.bzl must set a versionCode and versionName greater than the latest release, with a unique versionCode across open pull requests."
          exit 1

  bump:
    name: Bump version on /bump-version
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/bump-version')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Authorize the command
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const out = (k, v) => core.setOutput(k, String(v ?? ''));
            out('proceed', 'false');
            out('reason', '');

            const actor = comment?.user?.login || '';
            if (!actor || actor === 'github-actions[bot]') {
              out('reason', 'the command must come from a person, not a bot');
              return;
            }

            const firstLine = String(comment.body || '').split(/\r?\n/, 1)[0].trim();
            if (firstLine !== '/bump-version') {
              out('reason', 'only a `/bump-version` command is recognised');
              return;
            }

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor });
            if (!['admin', 'write'].includes(perm.data.permission)) {
              out('reason', `@${actor} does not have write access to this repository`);
              return;
            }

            let pr;
            try {
              pr = await github.rest.pulls.get({ owner, repo, pull_number: issue.number });
            } catch (e) {
              out('reason', 'the pull request could not be loaded');
              return;
            }

            if (pr.data.state !== 'open') {
              out('reason', 'the pull request is not open');
              return;
            }
            if (pr.data.base.ref !== 'main') {
              out('reason', `the pull request targets '${pr.data.base.ref}', not 'main'`);
              return;
            }
            if (pr.data.head.repo?.full_name !== `${owner}/${repo}`) {
              out('reason', 'the pull request comes from a fork; its author must bump the version');
              return;
            }

            out('head_ref', pr.data.head.ref);
            out('pr_number', String(issue.number));
            out('proceed', 'true');
            out('reason', 'ok');

      - name: Checkout the pull request branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute and write the next version
        if: steps.gate.outputs.proceed == 'true'
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The same rules the version guard enforces: above the latest release.
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          latest_name=""
          latest_code=""
          if [ -n "$latest_tag" ]; then
            latest_name="${latest_tag#v}"
            latest_code=$(gh release view "$latest_tag" --json assets --jq '.assets[].name' 2>/dev/null \
              | sed -nE 's/.*-([0-9]+)-[^-]+\.apk$/\1/p' | sort -n | tail -n1 || true)
            if [ -z "$latest_code" ]; then
              latest_code=$(git show "$latest_tag:version.bzl" 2>/dev/null \
                | grep -oE 'VERSION_CODE[[:space:]]*=[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
            fi
          fi

          cur_name=$(grep -oE 'VERSION_NAME[[:space:]]*=[[:space:]]*"[^"]*"' version.bzl | sed -E 's/.*"(.*)"/\1/' | head -n1)
          cur_code=$(grep -oE 'VERSION_CODE[[:space:]]*=[[:space:]]*[0-9]+' version.bzl | grep -oE '[0-9]+' | head -n1)

          if [ -z "$cur_name" ] || [ -z "$cur_code" ]; then
            echo "::error::Could not read versionName/versionCode from version.bzl."
            exit 1
          fi

          max_code="$cur_code"
          if [ -n "$latest_code" ] && [ "$latest_code" -gt "$max_code" ]; then
            max_code="$latest_code"
          fi
          next_code=$((max_code + 1))

          base_name="$cur_name"
          if [ -n "$latest_name" ]; then
            base_name=$(printf '%s\n%s\n' "$latest_name" "$cur_name" | sort -V | tail -n1)
          fi
          IFS=. read -r major minor patch <<< "$base_name"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::versionName '$base_name' is not a strict X.Y.Z value."
            exit 1
          fi
          next_name="$major.$minor.$((patch + 1))"

          NEXT_CODE="$next_code" NEXT_NAME="$next_name" python3 - <<'PY'
          import os
          import re

          code = os.environ["NEXT_CODE"]
          name = os.environ["NEXT_NAME"]
          path = "version.bzl"
          text = open(path).read()
          text, n1 = re.subn(r"(VERSION_CODE\s*=\s*)\d+", r"\g<1>" + code, text, count=1)
          text, n2 = re.subn(r'(VERSION_NAME\s*=\s*)"[^"]*"', r'\g<1>"' + name + '"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"expected one versionCode and one versionName, found {n1} and {n2}")
          open(path, "w").write(text)
          PY

          git --no-pager diff -- version.bzl
          {
            echo "next_name=$next_name"
            echo "next_code=$next_code"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push to the pull request branch
        if: steps.gate.outputs.proceed == 'true'
        env:
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
          NEXT_NAME: ${{ steps.bump.outputs.next_name }}
          NEXT_CODE: ${{ steps.bump.outputs.next_code }}
        run: |
          set -euo pipefail
          if git diff --quiet -- version.bzl; then
            echo "Nothing to commit; the version is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.bzl
          git commit -m "chore(release): bump to v${NEXT_NAME} (${NEXT_CODE})"
          git push origin "HEAD:${HEAD_REF}"

      - name: Report the outcome
        if: always()
        uses: actions/github-script@v9
        env:
          PROCEED: ${{ steps.gate.outputs.proceed }}
          REASON: ${{ steps.gate.outputs.reason }}
          NEXT_NAME: ${{ steps.bump.outputs.next_name }}
          NEXT_CODE: ${{ steps.bump.outputs.next_code }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const actor = context.payload.comment.user.login;
            let body;
            if (process.env.PROCEED !== 'true') {
              body = `⚠️ I could not bump the version: ${process.env.REASON || 'the request was not valid'}.`;
            } else {
              body = [
                '## ✅ Version bumped',
                '',
                `@${actor} asked me to bump the version, so I set \`VERSION_NAME = "${process.env.NEXT_NAME}"\` and \`VERSION_CODE = ${process.env.NEXT_CODE}\` in \`version.bzl\` on this branch and pushed the change.`,
                '',
                'The version guard re-runs on its own — once it is green, merge and the release starts automatically.',
              ].join('\n');
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  guard:
    name: Guard - application source check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deep-check whether a shipping file changed
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse "$head^" 2>/dev/null || echo "")
          fi

          if [ -z "$base" ]; then
            echo "No base commit to compare against; treating this as a change."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A file that ships in the APK or affects how it is built.
          is_shipping() {
            case "$1" in
              app/*) return 0 ;;
              BUILD.bazel|MODULE.bazel|*.bzl|version.bzl|.bazelrc) return 0 ;;
            esac
            return 1
          }

          # Use the three-dot form so the comparison is always against the merge
          # base. On a pull request this shows only this branch's own changes even
          # when `main` has moved on; on a push the merge base is simply the
          # previous commit, so the behaviour is unchanged.
          changed=$(git diff --name-only "$base...$head" || true)
          echo "Changed files:"
          echo "$changed"
          echo

          substantive=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! is_shipping "$file"; then
              continue
            fi

            # Ignore edits that only move whitespace or blank lines around.
            if git diff --quiet -w --ignore-blank-lines "$base...$head" -- "$file"; then
              echo "skip (whitespace/formatting only): $file"
              continue
            fi

            # Ignore edits that only touch comment lines.
            edits=$(git diff -w --ignore-blank-lines "$base...$head" -- "$file" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
            code=$(printf '%s\n' "$edits" | grep -vE '^[+-][[:space:]]*(//|/\*|\*|<!--|-->)' || true)
            if [ -z "$code" ]; then
              echo "skip (comments only): $file"
              continue
            fi

            echo "counts as a change: $file"
            substantive="$substantive$file"$'\n'
          done <<< "$changed"

          echo
          if [ -n "$substantive" ]; then
            echo "A shipping file changed; a release will be built."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No shipping file changed; nothing to release."
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi
  release:
    name: Release on merge to main
    needs: guard
    if: github.event_name == 'push' && needs.guard.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Set up Android SDK (platform 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Read the version from version.bzl
        id: version
        run: |
          set -euo pipefail

          app_name="EliteMemoPro"
          if [ -z "$app_name" ]; then
            echo "🔴 Release failed: app name could not be resolved."
            exit 1
          fi

          # The version guard on pull requests guarantees that every merge into
          # main already carries a bumped versionCode/versionName, so the
          # committed values are the single source of truth for the release.
          vn=$(grep -oE 'VERSION_NAME[[:space:]]*=[[:space:]]*"[^"]*"' version.bzl | sed -E 's/.*"(.*)"/\1/' | head -n1)
          vc=$(grep -oE 'VERSION_CODE[[:space:]]*=[[:space:]]*[0-9]+' version.bzl | grep -oE '[0-9]+' | head -n1)

          if [ -z "$vn" ] || [ -z "$vc" ]; then
            echo "🔴 Release failed: could not read versionName/versionCode from version.bzl."
            exit 1
          fi

          echo "Releasing v$vn ($vc) from commit $(git rev-parse HEAD)"
          {
            echo "app_name=$app_name"
            echo "version=$vn"
            echo "version_code=$vc"
          } >> "$GITHUB_OUTPUT"
      - name: Validate version
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "🔴 Release failed: versionName '$version' is not strict SemVer (X.Y.Z)."
            exit 1
          fi
          code="${{ steps.version.outputs.version_code }}"
          if ! echo "$code" | grep -qE '^[1-9][0-9]*$'; then
            echo "🔴 Release failed: versionCode '$code' is missing or not a positive integer."
            exit 1
          fi

      - name: Ensure the version is newer than the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          vn="${{ steps.version.outputs.version }}"
          vc="${{ steps.version.outputs.version_code }}"
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest_tag" ]; then
            echo "No previous release; nothing to compare against."
            exit 0
          fi
          latest_name="${latest_tag#v}"
          latest_code=$(gh release view "$latest_tag" --json assets --jq '.assets[].name' 2>/dev/null \
            | sed -nE 's/.*-([0-9]+)-[^-]+\.apk$/\1/p' | sort -n | tail -n1 || true)
          if [ -n "$latest_code" ] && [ "$vc" -le "$latest_code" ]; then
            echo "🔴 Release failed: versionCode $vc is not newer than $latest_tag ($latest_code). Re-bump and open a new pull request."
            exit 1
          fi
          if [ "$vn" != "$latest_name" ] && [ "$(printf '%s\n%s\n' "$latest_name" "$vn" | sort -V | tail -n1)" != "$vn" ]; then
            echo "🔴 Release failed: versionName $vn is not newer than $latest_tag ($latest_name). Re-bump and open a new pull request."
            exit 1
          fi

      - name: Check for existing tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "🔴 Release failed: Tag v${{ steps.version.outputs.version }} already exists on remote!"
            exit 1
          fi

      - name: Resolve release range
        id: context
        run: |
          target=$(git rev-parse HEAD)
          last_author=$(git log -1 --format='%an')
          if [ "$last_author" = "github-actions[bot]" ]; then
            while IFS=$'\t' read -r sha author; do
              case "$author" in
                *"[bot]"*) continue ;;
              esac
              target="$sha"
              break
            done < <(git log --format='%H%x09%an' -n 100)
          fi

          prev_tag=$(git describe --tags --abbrev=0 --match 'v*' "$target^" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            base="$prev_tag"
          else
            base=$(git rev-list --max-parents=0 "$target" | tail -n1)
          fi

          git log --oneline --no-merges "$base..$target" > /tmp/commits.txt || true
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "Comparing ${prev_tag:-the initial commit} -> $target"

      - name: Build diff-derived changelog
        env:
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          python3 - "$BASE" "$TARGET" <<'PY'
          import os
          import subprocess
          import sys
          from collections import OrderedDict

          base, target = sys.argv[1], sys.argv[2]


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout


          categories = OrderedDict([
              ("App source", lambda p: p.startswith("app/src/main/java/") or p.startswith("app/src/main/kotlin/")),
              ("Tests", lambda p: "/src/test/" in p or "/src/androidTest/" in p),
              ("Resources", lambda p: p.startswith("app/src/main/res/")),
              ("Manifest", lambda p: p.endswith("AndroidManifest.xml")),
              ("Build and dependencies", lambda p: p.endswith(("BUILD.bazel", "MODULE.bazel", ".bzl", ".bazelrc"))),
              ("CI and workflows", lambda p: p.startswith(".github/")),
              ("Documentation", lambda p: p.lower().endswith((".md", ".txt"))),
              ("Other", lambda p: True),
          ])


          def category_of(path):
              for name, matches in categories.items():
                  if matches(path):
                      return name
              return "Other"


          files = OrderedDict((name, []) for name in categories)
          added = OrderedDict((name, 0) for name in categories)
          deleted = OrderedDict((name, 0) for name in categories)

          for line in git("diff", "--numstat", base, target).splitlines():
              parts = line.split("\t")
              if len(parts) != 3:
                  continue
              add, rem, path = parts
              name = category_of(path)
              files[name].append(path)
              added[name] += int(add) if add.isdigit() else 0
              deleted[name] += int(rem) if rem.isdigit() else 0

          new_files, removed_files = [], []
          for line in git("diff", "--name-status", base, target).splitlines():
              parts = line.split("\t")
              if len(parts) < 2:
                  continue
              status, path = parts[0], parts[-1]
              if status.startswith("A"):
                  new_files.append(path)
              elif status.startswith("D"):
                  removed_files.append(path)

          total_files = sum(len(v) for v in files.values())
          total_add = sum(added.values())
          total_del = sum(deleted.values())
          commits = git("rev-list", "--count", base + ".." + target).strip() or "0"

          out = ["### Changes in this release", ""]
          out.append("**%d files changed** (+%d / -%d) across %s commit(s)." % (total_files, total_add, total_del, commits))
          out += ["", "| Area | Files | Added | Removed |", "| :--- | ---: | ---: | ---: |"]
          for name in categories:
              if files[name]:
                  out.append("| %s | %d | +%d | -%d |" % (name, len(files[name]), added[name], deleted[name]))
          out.append("")

          if new_files:
              out += ["#### New files", ""] + ["- `%s`" % p for p in new_files] + [""]
          if removed_files:
              out += ["#### Removed files", ""] + ["- `%s`" % p for p in removed_files] + [""]
          if files["Build and dependencies"]:
              out += ["#### Build and dependency files touched", ""] + ["- `%s`" % p for p in files["Build and dependencies"]] + [""]

          with open("/tmp/changelog.md", "w") as fh:
              fh.write("\n".join(out) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("files=%d\n" % total_files)
              fh.write("added=%d\n" % total_add)
              fh.write("deleted=%d\n" % total_del)
          PY

      - name: Analyse the diff with Copilot
        id: ai
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          set -uo pipefail
          echo "ran=false" >> "$GITHUB_OUTPUT"
          : > /tmp/ai-summary.md
          if [ -z "${COPILOT_TOKEN:-}" ]; then
            echo "No COPILOT_TOKEN configured; release notes will use the diff changelog only."
            exit 0
          fi
          npm install -g @github/copilot >/dev/null 2>&1 || true
          if ! command -v copilot >/dev/null 2>&1; then
            echo "Copilot CLI unavailable on this runner; release notes will use the diff changelog only."
            exit 0
          fi

          diff="$(git diff "$BASE" "$TARGET" | head -c 100000 || true)"
          prompt="Analyse this release diff for the Android app 'notepad'. Describe what actually changed and its impact, based only on the diff: new features, behaviour changes, bug fixes, refactors, and build or dependency changes. Do not repeat the diff line by line. Be concise and factual. Diff:${diff}"

          if out="$(GH_TOKEN="$COPILOT_TOKEN" copilot -p "$prompt" 2>&1)"; then
            printf '%s\n' "$out" > /tmp/ai-summary.md
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "Copilot analysis failed; release notes will use the diff changelog only."
          fi

      - name: Compose release notes
        env:
          AI_RAN: ${{ steps.ai.outputs.ran }}
          PREV_TAG: ${{ steps.context.outputs.prev_tag }}
          BASE: ${{ steps.context.outputs.base }}
          TARGET: ${{ steps.context.outputs.target }}
        run: |
          {
            if [ "$AI_RAN" = "true" ]; then
              echo "## Summary"
              echo ""
              cat /tmp/ai-summary.md
              echo ""
            fi
            cat /tmp/changelog.md
            echo ""
            if [ -s /tmp/commits.txt ]; then
              echo "### Commits"
              echo ""
              sed 's/^/- /' /tmp/commits.txt
              echo ""
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`$PREV_TAG\`. Released from commit \`$TARGET\`."
            else
              echo "First release. Released from commit \`$TARGET\`."
            fi
            echo ""
            echo "[Full diff](https://github.com/${{ github.repository }}/compare/$BASE...$TARGET)"
          } > /tmp/release-notes.md

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          bazel build //app:app --config=release

      - name: Rename release APKs
        run: |
          app_name="${{ steps.version.outputs.app_name }}"
          vn="${{ steps.version.outputs.version }}"
          vc="${{ steps.version.outputs.version_code }}"
          out="bazel-bin/app"

          shopt -s nullglob
          apks=("$out"/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No release APK was produced to rename."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            # Bazel writes one APK per ABI plus a universal one; the ABI is
            # the part after `app_` (or nothing for the universal APK).
            abi="${name%.apk}"
            abi="${abi#app_}"
            abi="${abi#app}"
            if [ -z "$abi" ] || [ "$abi" = "$name" ]; then
              abi="universal"
            fi
            mv "$apk" "$out/${app_name}-v${vn}-${vc}-${abi}.apk"
          done

          ls -l "$out"/*.apk

      - name: Verify APK signatures
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          shopt -s nullglob
          apks=(bazel-bin/app/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "🔴 No APK found to verify."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$build_tools/apksigner" verify --verbose "$apk"
          done

      - name: Append SHA-256 checksums
        run: |
          {
            echo ""
            echo "### SHA-256 checksums"
            echo ""
            echo '```'
            (cd bazel-bin/app && sha256sum ./*.apk)
            echo '```'
          } >> /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            bazel-bin/app/*.apk \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
