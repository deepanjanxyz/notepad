name: Debug APK

on:
  push:
    paths-ignore:
      # Documentation
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - '**/*.adoc'

      # Images
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
      - '**/*.bmp'
      - '**/*.tif'
      - '**/*.tiff'
      - '**/*.ico'
      - '**/*.avif'

      # Design / vector assets
      - '**/*.svg'
      - '**/*.psd'
      - '**/*.ai'
      - '**/*.sketch'

      # Video / audio assets
      - '**/*.mp4'
      - '**/*.mkv'
      - '**/*.webm'
      - '**/*.mov'
      - '**/*.avi'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.ogg'
      - '**/*.flac'

      # Repository metadata / miscellaneous non-build files
      - '**/.editorconfig'
      - '**/.gitattributes'
      - '**/.gitignore'
      - '**/.mailmap'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create debug keystore in root directory
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
          
