name: Multi-Platform Smart Auto Mirroring

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

# Mirror runs push to external hosts, so serialise them: two runs racing the
# same ref would fight over the remote and could clobber a force-sync.
concurrency:
  group: mirror
  cancel-in-progress: false

# Green while either host syncs, red only when both fail.

jobs:
  gitlab:
    name: Mirror to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mirrored: ${{ steps.record.outputs.mirrored }}

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Materialize All Branches Locally
        run: |
          git fetch origin --tags --force

          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin/ |
          grep -v '^HEAD$' |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue

            if ! git show-ref --verify --quiet "refs/heads/$branch"; then
              git branch --track "$branch" "origin/$branch"
            fi
          done

      - name: Sync to GitLab
        id: sync
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/gitlab-mirror.log"
          : > "$LOG"

          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.com/deepanjanxyz/notepad.git"
          refspecs=('refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*')

          echo "Attempting normal GitLab push..."

          if output=$(git push --prune "$GITLAB_URL" "${refspecs[@]}" 2>&1); then
            printf '%s\n' "$output" | tee -a "$LOG"
            echo "GitLab normal push succeeded."
            exit 0
          fi

          printf '%s\n' "$output" | tee -a "$LOG"

          # Force-push only on a real divergence; never on an auth, network or hook
          # failure, which would otherwise rewrite or delete refs on the mirror.
          if ! printf '%s\n' "$output" | grep -qiE 'non-fast-forward|fetch first|already exists|\[rejected\]'; then
            echo "::error::GitLab push failed for a reason other than divergence; refusing to force-push. See the log above."
            exit 1
          fi

          echo "GitLab push was rejected as a divergence; force-synchronising the mirror."

          if output=$(git push --force --prune "$GITLAB_URL" "${refspecs[@]}" 2>&1); then
            printf '%s\n' "$output" | tee -a "$LOG"
            echo "GitLab force synchronization succeeded."
            exit 0
          fi

          printf '%s\n' "$output" | tee -a "$LOG"
          echo "::error::GitLab force synchronization failed. See the log above."
          exit 1

      - name: Record GitLab result
        id: record
        if: always()
        run: |
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            echo "mirrored=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ GitLab mirror succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mirrored=false" >> "$GITHUB_OUTPUT"
            echo "### ❌ GitLab mirror failed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=GitLab mirror failed::The push to GitLab did not succeed; this run opens or updates the mirror issue."
          fi

      - name: Upload GitLab log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitlab-mirror-log
          path: ${{ runner.temp }}/gitlab-mirror.log
          if-no-files-found: ignore
          retention-days: 14

  codeberg:
    name: Mirror to Codeberg
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mirrored: ${{ steps.record.outputs.mirrored }}

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Materialize All Branches Locally
        run: |
          git fetch origin --tags --force

          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin/ |
          grep -v '^HEAD$' |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue

            if ! git show-ref --verify --quiet "refs/heads/$branch"; then
              git branch --track "$branch" "origin/$branch"
            fi
          done

      - name: Sync to Codeberg
        id: sync
        continue-on-error: true
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/codeberg-mirror.log"
          : > "$LOG"

          CODEBERG_URL="https://deepanjanxyz:${CODEBERG_TOKEN}@codeberg.org/deepanjanxyz/notepad.git"
          refspecs=('refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*')

          echo "Attempting normal Codeberg push..."

          if output=$(git push --prune "$CODEBERG_URL" "${refspecs[@]}" 2>&1); then
            printf '%s\n' "$output" | tee -a "$LOG"
            echo "Codeberg normal push succeeded."
            exit 0
          fi

          printf '%s\n' "$output" | tee -a "$LOG"

          if ! printf '%s\n' "$output" | grep -qiE 'non-fast-forward|fetch first|already exists|\[rejected\]'; then
            echo "::error::Codeberg push failed for a reason other than divergence; refusing to force-push. See the log above."
            exit 1
          fi

          echo "Codeberg push was rejected as a divergence; force-synchronising the mirror."

          if output=$(git push --force --prune "$CODEBERG_URL" "${refspecs[@]}" 2>&1); then
            printf '%s\n' "$output" | tee -a "$LOG"
            echo "Codeberg force synchronization succeeded."
            exit 0
          fi

          printf '%s\n' "$output" | tee -a "$LOG"
          echo "::error::Codeberg force synchronization failed. See the log above."
          exit 1

      - name: Record Codeberg result
        id: record
        if: always()
        run: |
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            echo "mirrored=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ Codeberg mirror succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mirrored=false" >> "$GITHUB_OUTPUT"
            echo "### ❌ Codeberg mirror failed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Codeberg mirror failed::The push to Codeberg did not succeed; this run opens or updates the mirror issue."
          fi

      - name: Upload Codeberg log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeberg-mirror-log
          path: ${{ runner.temp }}/codeberg-mirror.log
          if-no-files-found: ignore
          retention-days: 14

  # Reports the result and manages the bug issue.
  report:
    name: Mirror result
    needs: [gitlab, codeberg]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download mirror logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: mirror-logs
          merge-multiple: true

      - name: Report the result, and close or open the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_MIRRORED: ${{ needs.gitlab.outputs.mirrored }}
          CODEBERG_MIRRORED: ${{ needs.codeberg.outputs.mirrored }}
        run: |
          set -euo pipefail

          mark() {
            if [ "$1" = "true" ]; then echo "✅ ok"; else echo "❌ failed"; fi
          }

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title='[Mirror] Sync to GitLab or Codeberg failed'

          {
            echo '### Mirror result'
            echo
            echo '| Target | Result |'
            echo '| :--- | :--- |'
            echo "| GitLab | $(mark "$GITLAB_MIRRORED") |"
            echo "| Codeberg | $(mark "$CODEBERG_MIRRORED") |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Only ever touches its own issue (exact title, filed by this bot); a closed
          # issue is not found, so a recurrence opens a new one.
          own_open_issue() {
            gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq ".[] | select(.pull_request == null) | select(.title == \"${title}\") | select((.user.login // \"\") | test(\"github-actions\")) | .number" \
              | head -n1 || true
          }

          existing="$(own_open_issue)"

          if [ "$GITLAB_MIRRORED" = "true" ] && [ "$CODEBERG_MIRRORED" = "true" ]; then
            if [ -n "${existing:-}" ]; then
              echo "Both mirrors succeeded; closing #${existing}."
              gh issue close "$existing" --repo "${GITHUB_REPOSITORY}" \
                --comment "Both mirrors are syncing again: a push to \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`) reached GitLab and Codeberg, so I am closing this. If it breaks again, I will open a new issue."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Both mirrors succeeded — closed #${existing}." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Both mirrors succeeded; there was no open issue to close."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Both mirrors succeeded." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          failed=""
          [ "$GITLAB_MIRRORED" = "true" ] || failed="${failed} GitLab"
          [ "$CODEBERG_MIRRORED" = "true" ] || failed="${failed} Codeberg"
          failed="${failed# }"

          logs="$(cat mirror-logs/*.log 2>/dev/null | tail -n 200 || true)"
          [ -n "$logs" ] || logs="(no log was captured)"

          {
            echo '<!-- mirror-failure-report -->'
            echo
            echo '## 🔴 Mirror sync failed'
            echo
            echo "A push to \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`) could not be mirrored to: ${failed}."
            echo
            echo '| Target | Result |'
            echo '| :--- | :--- |'
            echo "| GitLab | $(mark "$GITLAB_MIRRORED") |"
            echo "| Codeberg | $(mark "$CODEBERG_MIRRORED") |"
            echo
            echo "- **Ref:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Run:** ${run_url}"
            echo
            echo '<details>'
            echo '<summary>Log output (last 200 lines)</summary>'
            echo
            echo '```'
            printf '%s\n' "$logs"
            echo '```'
            echo
            echo '</details>'
          } > mirror-failure.md

          if [ -n "${existing:-}" ]; then
            echo "Commenting on the open mirror issue #${existing}."
            gh issue comment "$existing" --repo "${GITHUB_REPOSITORY}" --body-file mirror-failure.md
          else
            echo "Opening a new mirror issue."
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "$title" \
              --body-file mirror-failure.md --label bug
          fi

          if [ "$GITLAB_MIRRORED" = "true" ] || [ "$CODEBERG_MIRRORED" = "true" ]; then
            echo "At least one mirror succeeded, so the run stays green; the issue records the host that failed."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "At least one mirror succeeded — the run stays green; the failed host is recorded in the issue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Both mirrors failed."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Both mirrors failed.**" >> "$GITHUB_STEP_SUMMARY"
          exit 1
