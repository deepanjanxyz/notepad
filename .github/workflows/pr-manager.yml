name: PR Manager

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-manager-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enforce-target:
    name: Enforce the PR target policy
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.state == 'open'
      && (github.event.pull_request.base.ref != 'main' || github.event.pull_request.head.ref != 'dev')
    steps:
      # A pull_request workflow runs from the pull request's own branch, so the
      # run that introduces this file would close the pull request that adds it.
      # While the file is absent from the base branch, leave that pull request
      # alone; once it is on main, every later pull request is evaluated.
      - name: Check whether this workflow is already on the base branch
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/.github/workflows/pr-manager.yml?ref=${{ github.event.pull_request.base.ref }}" > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "pr-manager.yml is on ${{ github.event.pull_request.base.ref }}; enforcing the target policy."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "pr-manager.yml is not on ${{ github.event.pull_request.base.ref }} yet; this pull request is introducing it, so it is left open."
          fi

      - name: Comment on the pull request and close it
        if: steps.base.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // The policy is documented in CONTRIBUTING.md on the default branch.
            const guide = `${context.serverUrl}/${owner}/${repo}/blob/${pr.base.repo.default_branch}/CONTRIBUTING.md`;
            const workflow = `${context.serverUrl}/${owner}/${repo}/actions/workflows/pr-manager.yml`;

            const body = [
              '## This pull request was closed automatically',
              '',
              `Elite Memo Pro accepts exactly one pull request target: **\`dev\` → \`main\`**, the release pipeline.`,
              `This pull request targets \`${pr.base.ref}\` from \`${pr.head.ref}\`, so it does not meet the policy and cannot be merged.`,
              '',
              '### What to do instead',
              '',
              '- Land your work on the `dev` branch.',
              '- When `dev` is ready to ship, open a pull request **from `dev` into `main`**.',
              '',
              `Read [CONTRIBUTING.md](${guide}) before opening another pull request.`,
              '',
              '---',
              '',
              `*Closed by the [PR Manager](${workflow}) workflow.*`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: 'closed',
            });

            core.notice(`Closed #${pr.number}: ${pr.head.ref} → ${pr.base.ref} is not dev → main.`);
