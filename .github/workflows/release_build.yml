name: Signed Release APK

# Manually triggered signed release build — no branch is hardcoded.
# Pick any branch from the "Run workflow" dropdown when dispatching;
# the workflow builds and signs whatever ref it was dispatched with.
# The app module's build.gradle.kts signs the release build itself using:
#   - app/keystore.jks (decoded at build time from the KEYSTORE_BASE64 secret)
#   - NOTEPAD_STORE_PASSWORD / NOTEPAD_KEY_ALIAS / NOTEPAD_KEY_PASSWORD
#     (mapped below from the KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-release:
    name: Build signed release APK (${{ github.ref_name }})
    runs-on: ubuntu-latest

    env:
      NOTEPAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      NOTEPAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      NOTEPAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$NOTEPAD_STORE_PASSWORD" ] || [ -z "$NOTEPAD_KEY_ALIAS" ] || [ -z "$NOTEPAD_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in the repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore file
        if: always()
        run: rm -f app/keystore.jks

      - name: Sanitize branch name for artifact
        id: branch
        run: echo "name=$(echo '${{ github.ref_name }}' | tr '/ ' '__')" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ steps.branch.outputs.name }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
