name: Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Generate screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Checkout screenshot scripts
        uses: actions/checkout@v7
        with:
          ref: ci/screenshots
          path: .ci

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK platform 37
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR" || SDKMGR="$(command -v sdkmanager)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          # AGP resolves compileSdk 37 as "android-37" while sdkmanager installs it as "android-37.0".
          ln -sfn "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: bash .ci/scripts/screenshots/run_screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload notes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-and-logs
          path: notes-and-logs/
          if-no-files-found: warn
