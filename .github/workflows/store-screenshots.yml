name: Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Generate screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Checkout screenshot scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: ci/screenshots
          path: .ci

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK tools and accept licenses
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: bash .ci/scripts/screenshots/run_screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload notes and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: notes-and-logs
          path: notes-and-logs/
          if-no-files-found: warn
