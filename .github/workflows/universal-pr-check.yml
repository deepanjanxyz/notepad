name: Universal PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    name: Debug & release build (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (platform 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # A release keystore is only available for branches inside this repo, not
      # for pull requests opened from a fork. We drop it in the same place the
      # old Gradle build expected it so a signed release can be produced.
      - name: Decode release keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          else
            echo "No release keystore secret is available; skipping. This is expected for pull requests opened from a fork."
          fi

      - name: Assemble debug and release
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            bazel build //app:app --config=release
          else
            echo "Release signing secrets are unavailable (for example on a pull request from a fork); building the debug variant only."
            bazel build //app:app
          fi

      - name: Remove keystore file
        if: always()
        run: rm -f app/keystore.jks

  unit-tests:
    name: Unit tests (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (platform 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run unit tests
        run: bazel test //... --test_output=errors

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: PR status report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, unit-tests, secrets-scan]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assemble report
        id: body
        env:
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.unit-tests.result }}
          SECRETS: ${{ needs.secrets-scan.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BUILD" = "success" ]; then
            build_icon="🟢"; build_summary="Debug and signed release APKs assembled"
          else
            build_icon="🔴"; build_summary="Debug or release build failed"
          fi

          if [ "$TESTS" = "success" ]; then
            tests_icon="🟢"; tests_summary="All unit tests passed"
          else
            tests_icon="🔴"; tests_summary="Unit tests failed"
          fi

          if [ "$SECRETS" = "success" ]; then
            secrets_icon="🟢"; secrets_summary="No hardcoded secrets detected"
          else
            secrets_icon="🔴"; secrets_summary="Potential secret detected"
          fi

          {
            echo "## Pull request check summary"
            echo ""
            echo "| Test & Inspection Suite | Status | Summary |"
            echo "| :--- | :---: | :--- |"
            echo "| **Debug & Release Build** | $build_icon | $build_summary |"
            echo "| **Unit Tests** | $tests_icon | $tests_summary |"
            echo "| **Security & Secret Scan** | $secrets_icon | $secrets_summary |"
            echo ""
            echo "[View full run]($RUN_URL)"
          } > report.md

      - name: Post or update the report comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- universal-pr-check -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
