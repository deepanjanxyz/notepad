name: Version Guard


on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, synchronize, reopened]
  # version-bump.yml re-fires this guard with workflow_dispatch after a bump.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-check
        required: true
        type: string

concurrency:
  group: version-guard-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard - application source check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deep-check whether a shipping file changed
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash .github/scripts/shipping-changed.sh
  version-guard:
    name: Guard - version bump required
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The version is read from the working tree, so this has to be the
          # pull request's own commit. A workflow_dispatch re-check carries no
          # pull_request payload, so it takes refs/pull/<n>/head rather than the
          # branch the run was dispatched on.
          ref: ${{ inputs.pr != '' && format('refs/pull/{0}/head', inputs.pr) || github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Reuse the shipping-file check from the `guard` job: a pull request that
      # only touches documentation (README, *.md, *.txt, images, or any other
      # non-shipping path) must not be forced to raise the version.
      - name: Decide whether this pull request must bump the version
        id: scope
        env:
          CODE_CHANGED: ${{ needs.guard.outputs.code_changed }}
        run: |
          if [ "$CODE_CHANGED" = "true" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Shipping files changed; a version bump is required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change (README, .md, .txt, images or other non-shipping files); no version bump is required."
          fi

      - name: Note that a documentation-only change skips the version bump
        if: steps.scope.outputs.required != 'true'
        run: echo "::notice::Documentation-only change; the version bump requirement is skipped."

      - name: Compare the PR version with the latest release
        id: compare
        if: steps.scope.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail

          pr_name=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]*"' app/build.gradle.kts | sed -E 's/.*"(.*)"/\1/' | head -n1 || true)
          pr_code=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -n1 || true)

          if [ -z "$pr_name" ] || [ -z "$pr_code" ]; then
            echo "Could not read versionName/versionCode from app/build.gradle.kts."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          latest_name=""
          latest_code=""
          if [ -n "$latest_tag" ]; then
            latest_name="${latest_tag#v}"
            # The versionCode as actually published in the latest release's APK names.
            latest_code=$(gh release view "$latest_tag" --json assets --jq '.assets[].name' 2>/dev/null \
              | sed -nE 's/.*-([0-9]+)-[^-]+\.apk$/\1/p' | sort -n | tail -n1 || true)
            # Fall back to the versionCode committed at that tag.
            if [ -z "$latest_code" ]; then
              latest_code=$(git show "$latest_tag:app/build.gradle.kts" 2>/dev/null \
                | grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
            fi
          fi

          echo "PR:             versionName=$pr_name versionCode=$pr_code"
          echo "Latest release: tag=${latest_tag:-<none>} versionName=${latest_name:-<unknown>} versionCode=${latest_code:-<unknown>}"

          {
            echo "pr_name=$pr_name"
            echo "pr_code=$pr_code"
            echo "latest_tag=$latest_tag"
            echo "latest_name=$latest_name"
            echo "latest_code=$latest_code"
          } >> "$GITHUB_OUTPUT"

          # 1. versionCode must be greater than the latest release's versionCode.
          if [ -z "$latest_code" ]; then
            echo "No released versionCode found; skipping the numeric comparison."
          elif [ "$pr_code" -le "$latest_code" ]; then
            echo "versionCode not bumped: $pr_code <= $latest_code"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. versionName must be X.Y.Z, optionally with a pre-release suffix, and greater
          #    than the latest release's versionName.
          if ! echo "$pr_name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "versionName is not strict SemVer (X.Y.Z): $pr_name"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=name" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # SemVer precedence, which `sort -V` cannot answer: it ranks
          # `1.0.31-beta01` above `1.0.31`, while SemVer puts the stable release
          # first. Promoting a pre-release to its own release would otherwise be
          # blocked until a later version existed. The versionCode check above
          # still has to pass first, so a stable release is only accepted when its
          # versionCode is higher than the latest tag's.
          semver_gt() {
            local a="$1" b="$2"
            local a_core="${a%%-*}" b_core="${b%%-*}"
            local a_pre="" b_pre=""
            case "$a" in *-*) a_pre="${a#*-}" ;; esac
            case "$b" in *-*) b_pre="${b#*-}" ;; esac
            if [ "$a_core" != "$b_core" ]; then
              [ "$(printf '%s\n%s\n' "$a_core" "$b_core" | sort -V | tail -n1)" = "$a_core" ]
              return
            fi
            # Same core: the release without a pre-release suffix has precedence.
            if [ -z "$a_pre" ] && [ -z "$b_pre" ]; then return 1; fi
            if [ -z "$a_pre" ]; then return 0; fi
            if [ -z "$b_pre" ]; then return 1; fi
            local IFS='.'
            local -a a_parts=($a_pre)
            local -a b_parts=($b_pre)
            unset IFS
            local i=0 a_seg="" b_seg=""
            while [ "$i" -lt "${#a_parts[@]}" ] || [ "$i" -lt "${#b_parts[@]}" ]; do
              a_seg="${a_parts[$i]:-}"
              b_seg="${b_parts[$i]:-}"
              i=$((i + 1))
              [ "$a_seg" = "$b_seg" ] && continue
              # Fewer identifiers sorts lower when everything before it matched.
              if [ -z "$a_seg" ]; then return 1; fi
              if [ -z "$b_seg" ]; then return 0; fi
              if [[ "$a_seg" =~ ^[0-9]+$ && "$b_seg" =~ ^[0-9]+$ ]]; then
                [ "$a_seg" -gt "$b_seg" ]
                return
              fi
              # A numeric identifier always sorts below an alphanumeric one.
              if [[ "$a_seg" =~ ^[0-9]+$ ]]; then return 1; fi
              if [[ "$b_seg" =~ ^[0-9]+$ ]]; then return 0; fi
              [ "$a_seg" \> "$b_seg" ]
              return
            done
            return 1
          }

          if [ -n "$latest_name" ] && ! semver_gt "$pr_name" "$latest_name"; then
            echo "versionName not bumped: $pr_name <= $latest_name"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. No other open pull request into main may claim the same versionCode.
          # A scan that errors must not read as "no collisions", or this pull request
          # would pass a check it never really satisfied.
          if ! pr_list=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --state open --limit 100 \
            --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"'); then
            echo "::error::Could not list the open pull requests to check for versionCode collisions."
            exit 1
          fi

          collision=""
          while read -r num oid; do
            [ -z "$num" ] && continue
            [ "$num" = "$PR" ] && continue
            if ! other=$(gh api --include \
              "repos/${GITHUB_REPOSITORY}/contents/app/build.gradle.kts?ref=${oid}" \
              -H "Accept: application/vnd.github.raw"); then
              status=$(printf '%s\n' "$other" | awk '$1 ~ /^HTTP\/[0-9.]+$/ { print $2; exit }')
              if [ "$status" = "404" ]; then
                # This pull request carries no app/build.gradle.kts, so there is nothing to compare.
                continue
              fi
              echo "::error::Could not read app/build.gradle.kts for open pull request #${num}."
              exit 1
            fi
            other_code=$(printf '%s\n' "$other" \
              | grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
            if [ -n "$other_code" ] && [ "$other_code" = "$pr_code" ]; then
              collision="$num"
              break
            fi
          done <<< "$pr_list"

          if [ -n "$collision" ]; then
            echo "versionCode $pr_code collides with open pull request #$collision"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "reason=collision" >> "$GITHUB_OUTPUT"
            echo "collision_pr=$collision" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same three words decide a pre-release here as in the release
          # workflow, so the two never disagree about what a suffix means.
          if echo "$pr_name" | grep -qiE '(^|[.-])(alpha|beta|rc)[0-9]*([.-]|$)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::versionName $pr_name is a pre-release (alpha, beta or rc)."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version bump OK: versionCode $pr_code > ${latest_code:-none}, versionName $pr_name > ${latest_name:-none}"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: steps.scope.outputs.required == 'true' && steps.compare.outputs.bumped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          PR_NAME: ${{ steps.compare.outputs.pr_name }}
          PR_CODE: ${{ steps.compare.outputs.pr_code }}
          LATEST_TAG: ${{ steps.compare.outputs.latest_tag }}
          LATEST_NAME: ${{ steps.compare.outputs.latest_name }}
          LATEST_CODE: ${{ steps.compare.outputs.latest_code }}
          COLLISION_PR: ${{ steps.compare.outputs.collision_pr }}
          REASON: ${{ steps.compare.outputs.reason }}
        run: |
          set -euo pipefail
          marker='<!-- version-guard -->'

          case "${REASON:-}" in
            missing)
              detail="Could not read \`versionCode\`/\`versionName\` from \`app/build.gradle.kts\`." ;;
            code)
              detail="This pull request declares \`versionCode = ${PR_CODE:-?}\`, but the latest release \`${LATEST_TAG:-<none>}\` already uses \`versionCode ${LATEST_CODE:-?}\`." ;;
            name)
              detail="\`versionName\` must be a strict \`X.Y.Z\` value greater than the latest release \`${LATEST_NAME:-?}\`, but this pull request declares \`${PR_NAME:-?}\`." ;;
            collision)
              detail="\`versionCode ${PR_CODE:-?}\` is also claimed by open pull request #${COLLISION_PR:-?}. Only one open pull request may use a given \`versionCode\`." ;;
            *)
              detail="The version in \`app/build.gradle.kts\` does not satisfy the release rules." ;;
          esac

          body=$(cat <<EOF
          ${marker}
          ## 🔴 Version bump required

          ${detail}

          Every pull request merged into \`main\` must raise \`versionCode\` above the
          latest release and set a \`versionName\` that is a greater \`X.Y.Z\`, so the
          release job can tag and publish the merge without rewriting the version.

          ### 🛠️ Fix it in one step

          Comment **\`/bump-version\`** on this pull request and the bot will raise
          both values on this branch for you. This check then re-runs on its own —
          once it is green, merge and the release starts automatically.

          ### ✍️ Or do it by hand

          \`\`\`kotlin
          versionCode = <greater than ${LATEST_CODE:-the latest}>
          versionName = "<greater than ${LATEST_NAME:-the latest}>"
          \`\`\`
          Then push — the check re-runs automatically.
          EOF
          )

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi

      - name: Remove the guard comment once the version is bumped
        if: steps.scope.outputs.required == 'true' && steps.compare.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          marker='<!-- version-guard -->'
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" > /dev/null || true
          done

      - name: Fail the check when the version was not bumped
        if: steps.scope.outputs.required == 'true' && steps.compare.outputs.bumped != 'true'
        run: |
          echo "::error::app/build.gradle.kts must set a versionCode and versionName greater than the latest release, with a unique versionCode across open pull requests."
          exit 1
