plugins {
    id 'com.android.application'
}

android {
    namespace = "com.deepanjanxyz.notepad"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.deepanjanxyz.notepad"
        minSdk = 24
        targetSdk = 34
        versionCode 10
        versionName "1.0.10"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Always embed the VCS revision in release APKs so IzzyOnDroid's
            // reproducible-build checks can tell exactly which commit an APK
            // was built from (required since https://codeberg.org/IzzyOnDroid/repodata/issues/539)
            vcsInfo {
                include true
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.9.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.preference:preference:1.2.0")
    implementation("androidx.biometric:biometric:1.1.0")
}
