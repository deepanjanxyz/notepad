# Keep compiler and Gradle JVM settings deterministic across supported build hosts.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Let the Android Gradle Plugin download missing SDK packages during command-line builds.
android.builder.sdkDownload=true
